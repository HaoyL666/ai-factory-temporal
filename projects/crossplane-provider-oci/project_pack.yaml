project_id: crossplane-provider-oci
display_name: Crossplane Provider OCI
description: >
  Project pack for Terraform provider version upgrades in Crossplane Provider OCI.

repository:
  expected_name: provider-oci
  terraform_provider_source: oracle/oci
  terraform_provider_version_variable: TERRAFORM_PROVIDER_VERSION
  source_of_truth_paths:
    - Makefile
    - config/
  generated_paths:
    - apis/
    - internal/apis/
    - internal/controller/
    - package/crds/
    - examples-generated/
    - docs/

supported_tasks:
  - terraform_provider_upgrade

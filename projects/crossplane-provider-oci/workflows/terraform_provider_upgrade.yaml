id: terraform_provider_upgrade
name: Terraform Provider Version Upgrade
description: >
  Upgrade the Terraform provider version for Crossplane Provider OCI with scoped
  AI edits, deterministic generation/build evidence, approval gates for protected
  actions, and a final owner review packet.

steps:
  - id: confirm_target_and_baseline
    name: Confirm Target and Baseline
    kind: codex
    prompt: prompts/terraform_provider_upgrade/confirm_target_and_baseline.md
    sandbox: read-only
    output_contract:
      required_fields:
        - summary
        - changed_files
        - checks
        - evidence
        - risks

  - id: apply_version_bump
    name: Apply Version Bump
    kind: codex
    prompt: prompts/terraform_provider_upgrade/apply_version_bump.md
    sandbox: workspace-write
    review: true
    output_contract:
      required_fields:
        - summary
        - changed_files
        - checks
        - evidence
        - risks

  - id: generate_diff_evidence
    name: Generate and Diff Evidence
    kind: deterministic
    command:
      - python3.12
      - "{{project_dir}}/scripts/collect_generation_evidence.py"
    cwd: "{{workspace_path}}"
    timeout_seconds: 7200
    max_feedback_retries: 2

  - id: classify_breaking_changes
    name: Classify Breaking Changes
    kind: codex
    prompt: prompts/terraform_provider_upgrade/classify_breaking_changes.md
    sandbox: read-only
    output_contract:
      required_fields:
        - summary
        - changed_files
        - checks
        - evidence
        - risks

  - id: custom_config_controller_impact
    name: Check Custom Config and Controller Impact
    kind: codex
    prompt: prompts/terraform_provider_upgrade/custom_config_controller_impact.md
    sandbox: read-only
    output_contract:
      required_fields:
        - summary
        - changed_files
        - checks
        - evidence
        - risks

  - id: build_test_package
    name: Build, Test, and Package Evidence
    kind: deterministic
    command:
      - python3.12
      - "{{project_dir}}/scripts/collect_build_package_evidence.py"
    cwd: "{{workspace_path}}"
    timeout_seconds: 7200
    max_feedback_retries: 2

  - id: publish_approval
    name: Publish Artifacts Approval
    kind: approval
    message: >
      Approve publishing provider artifacts only after reviewing the target
      version, destination, provenance, checksums, and redacted evidence.
    approved_step:
      command:
        - python3.12
        - "{{project_dir}}/scripts/record_publish_gate.py"
      cwd: "{{workspace_path}}"
      timeout_seconds: 1800

  - id: install_validation_approval
    name: Install Validation Approval
    kind: approval
    message: >
      Approve Kubernetes or OKE install validation only after reviewing the
      cluster target, package reference, ProviderConfig path, and secret usage.
    approved_step:
      command:
        - python3.12
        - "{{project_dir}}/scripts/record_install_validation_gate.py"
      cwd: "{{workspace_path}}"
      timeout_seconds: 3600

  - id: live_oci_validation_approval
    name: Live OCI Validation Approval
    kind: approval
    message: >
      Approve live OCI validation only for selected resources with explicit
      cleanup and redaction requirements.
    approved_step:
      command:
        - python3.12
        - "{{project_dir}}/scripts/record_live_oci_validation_gate.py"
      cwd: "{{workspace_path}}"
      timeout_seconds: 3600

  - id: assemble_final_review_packet
    name: Assemble Final Review Packet
    kind: codex
    prompt: prompts/terraform_provider_upgrade/assemble_final_review_packet.md
    sandbox: read-only
    output_contract:
      required_fields:
        - summary
        - changed_files
        - checks
        - evidence
        - risks

id: review_retry_chain_e2e
name: Review Repair And Feedback Retry Chain E2E
description: >
  E2E workflow that runs a reviewed Codex step with one rejection and repair,
  then runs a second reviewed Codex step that fails as business logic first,
  waits for human feedback, retries, gets reviewer approval, and continues.
steps:
  - id: codex_review_repair_first
    name: Codex Review Repair First
    kind: codex
    prompt: prompts/review_retry_chain/review_repair_first.md
    review:
      enabled: true
      max_review_rounds: 2
      reviewer_timeout_seconds: 900
    output_contract:
      type: status_json
      required_fields:
        - summary
        - changed_files
    timeout_seconds: 900
    max_feedback_retries: 0

  - id: codex_business_fail_then_review
    name: Codex Business Fail Then Review
    kind: codex
    prompt: prompts/review_retry_chain/retry_then_review.md
    review:
      enabled: true
      max_review_rounds: 1
      reviewer_timeout_seconds: 900
    output_contract:
      type: status_json
      required_fields:
        - summary
        - changed_files
    timeout_seconds: 900
    max_feedback_retries: 1

  - id: verify_review_retry_chain
    name: Verify Review Retry Chain
    kind: deterministic
    runner: script
    command:
      - python3.12
      - "{{project_dir}}/scripts/verify_review_retry_chain.py"
    cwd: "{{workspace_path}}"
    timeout_seconds: 120
    allow_skip: false
    max_feedback_retries: 0

  - id: final_publish
    name: Final Deterministic Publish
    kind: deterministic
    runner: script
    command:
      - python3.12
      - "{{project_dir}}/scripts/mock_publish.py"
    cwd: "{{workspace_path}}"
    timeout_seconds: 120
    allow_skip: false
    max_feedback_retries: 0
